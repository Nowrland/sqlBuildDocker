services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ssl:/tmp/ssl-src:ro
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /tmp/pg-ssl
        cp /tmp/ssl-src/server.crt /tmp/pg-ssl/server.crt
        cp /tmp/ssl-src/server.key /tmp/pg-ssl/server.key
        chown postgres:postgres /tmp/pg-ssl/server.crt /tmp/pg-ssl/server.key
        chmod 600 /tmp/pg-ssl/server.key
        chmod 644 /tmp/pg-ssl/server.crt
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tmp/pg-ssl/server.crt
      - -c
      - ssl_key_file=/tmp/pg-ssl/server.key
      - -c
      - client_encoding=UTF8

volumes:
  postgres_data:
